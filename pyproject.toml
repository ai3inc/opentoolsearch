[project]
name = "opentoolsearch"
version = "0.1.0"
description = "Open-source tool retrieval: a small embedding model and a drop-in tool_search for function-calling agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["sentence-transformers>=5", "numpy"]

[project.optional-dependencies]
train = ["torch", "datasets", "pytrec_eval-terrier", "bm25s", "PyStemmer", "transformers>=4.56"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["opentoolsearch"]
